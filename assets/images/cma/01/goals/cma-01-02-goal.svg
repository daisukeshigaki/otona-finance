<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">第2回 利益は段階で読む</title><desc id="d">粗利率と営業利益率を区別し、価格と費用の変化が利益へ与える影響を説明できる。</desc><rect width="1600" height="900" rx="28" fill="#f7fafc"/><rect x="0" y="0" width="1600" height="118" rx="28" fill="#082f5b"/><text x="90" y="76" fill="#fff" font-family="sans-serif" font-size="42" font-weight="700">この講義で身につくこと</text><text x="90" y="190" fill="#0b355f" font-family="sans-serif" font-size="46" font-weight="700">第2回 利益は段階で読む</text><text x="90" y="260" fill="#41566b" font-family="sans-serif" font-size="30">粗利率と営業利益率を区別し、価格と費用の変化が利益へ与える</text><text x="90" y="308" fill="#41566b" font-family="sans-serif" font-size="30">影響を説明できる。</text><path d="M260 600 H1340" stroke="#9eb6c9" stroke-width="8"/><defs><marker id="a" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#f59e0b"/></marker></defs><rect x="90" y="470" width="330" height="250" rx="24" fill="#e8f2fb" stroke="#4f86b5" stroke-width="4"/><circle cx="250" cy="515" r="28" fill="#1263a0"/><text x="250" y="526" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">1</text><text x="250" y="590" text-anchor="middle" fill="#173b5e" font-family="sans-serif" font-size="29" font-weight="700">利益は段階で読む</text><path d="M430 600 H570" stroke="#f59e0b" stroke-width="10" marker-end="url(#a)"/><rect x="610" y="470" width="330" height="250" rx="24" fill="#fff4d8" stroke="#f59e0b" stroke-width="4"/><circle cx="770" cy="515" r="28" fill="#f59e0b"/><text x="770" y="526" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">2</text><text x="770" y="590" text-anchor="middle" fill="#173b5e" font-family="sans-serif" font-size="29" font-weight="700">売上−原価−販管費</text><path d="M950 600 H1090" stroke="#f59e0b" stroke-width="10" marker-end="url(#a)"/><rect x="1130" y="470" width="330" height="250" rx="24" fill="#e8f2fb" stroke="#4f86b5" stroke-width="4"/><circle cx="1290" cy="515" r="28" fill="#1263a0"/><text x="1290" y="526" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">3</text><text x="1290" y="590" text-anchor="middle" fill="#173b5e" font-family="sans-serif" font-size="29" font-weight="700">利益率で構造を比較</text><text x="800" y="820" text-anchor="middle" fill="#52697c" font-family="sans-serif" font-size="27">用語を暗記するだけでなく、数字と因果関係を説明できる状態を目指します</text></svg>