<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ドルコスト平均法の計算</title><desc id="desc">毎回1万円を異なる価格で購入し、安い時に多く、高い時に少なく買うことを示す。</desc>
  <rect width="1600" height="900" fill="#f7fafc"/><text x="800" y="90" text-anchor="middle" font-family="sans-serif" font-size="58" font-weight="700" fill="#123f66">定額購入法：毎回「同じ金額」を買う</text>
  <text x="800" y="145" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#496273">価格が安い回は多く、高い回は少なく買う</text>
  <g font-family="sans-serif">
    <g transform="translate(90 215)"><rect width="420" height="360" rx="24" fill="#fff" stroke="#8eb6d4" stroke-width="4"/><text x="210" y="58" text-anchor="middle" font-size="35" font-weight="700" fill="#123f66">1月</text><text x="210" y="120" text-anchor="middle" font-size="30" fill="#344b5e">価格 1,000円</text><text x="210" y="180" text-anchor="middle" font-size="30" fill="#344b5e">投資 10,000円</text><path d="M210 205v55" stroke="#e18a21" stroke-width="9" marker-end="url(#arrow)"/><text x="210" y="320" text-anchor="middle" font-size="48" font-weight="700" fill="#1771a8">10口</text></g>
    <g transform="translate(590 215)"><rect width="420" height="360" rx="24" fill="#fff" stroke="#70b38b" stroke-width="5"/><text x="210" y="58" text-anchor="middle" font-size="35" font-weight="700" fill="#123f66">2月</text><text x="210" y="120" text-anchor="middle" font-size="30" fill="#344b5e">価格 500円</text><text x="210" y="180" text-anchor="middle" font-size="30" fill="#344b5e">投資 10,000円</text><path d="M210 205v55" stroke="#e18a21" stroke-width="9" marker-end="url(#arrow)"/><text x="210" y="320" text-anchor="middle" font-size="48" font-weight="700" fill="#14834e">20口</text><text x="210" y="350" text-anchor="middle" font-size="22" fill="#14834e">安いので多く買える</text></g>
    <g transform="translate(1090 215)"><rect width="420" height="360" rx="24" fill="#fff" stroke="#8eb6d4" stroke-width="4"/><text x="210" y="58" text-anchor="middle" font-size="35" font-weight="700" fill="#123f66">3月</text><text x="210" y="120" text-anchor="middle" font-size="30" fill="#344b5e">価格 2,000円</text><text x="210" y="180" text-anchor="middle" font-size="30" fill="#344b5e">投資 10,000円</text><path d="M210 205v55" stroke="#e18a21" stroke-width="9" marker-end="url(#arrow)"/><text x="210" y="320" text-anchor="middle" font-size="48" font-weight="700" fill="#1771a8">5口</text></g>
    <rect x="190" y="650" width="1220" height="150" rx="25" fill="#123f66"/><text x="800" y="710" text-anchor="middle" font-size="36" font-weight="700" fill="#fff">総投資額 30,000円 ÷ 総購入数量 35口</text><text x="800" y="765" text-anchor="middle" font-size="43" font-weight="700" fill="#ffd166">平均購入単価 ≒ 857円／口</text><text x="800" y="850" text-anchor="middle" font-size="24" fill="#5c6f7e">利益・元本を保証する方法ではありません（手数料なしの学習例）</text>
  </g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#e18a21"/></marker></defs>
</svg>
