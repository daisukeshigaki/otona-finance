<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">不動産鑑定評価の三手法</title><desc id="desc">原価法、取引事例比較法、収益還元法の出発点と求める価格を示す。</desc>
  <rect width="1600" height="900" fill="#f7fafc"/><text x="800" y="92" text-anchor="middle" font-family="sans-serif" font-size="58" font-weight="700" fill="#123f66">不動産価格を見る「3つの入口」</text><text x="800" y="145" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#496273">何を手掛かりに価格を求めるかで見分ける</text>
  <g font-family="sans-serif">
    <g transform="translate(70 220)"><rect width="460" height="465" rx="25" fill="#fff" stroke="#3f83b5" stroke-width="5"/><text x="230" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#123f66">原価法</text><text x="230" y="122" text-anchor="middle" font-size="28" fill="#344b5e">今、同じものをつくる費用</text><rect x="105" y="160" width="250" height="100" rx="12" fill="#dcecf7"/><text x="230" y="220" text-anchor="middle" font-size="28" font-weight="700" fill="#123f66">再調達原価</text><path d="M230 275v55" stroke="#e18a21" stroke-width="9" marker-end="url(#arrow)"/><text x="230" y="370" text-anchor="middle" font-size="27" fill="#344b5e">経年・機能低下などを</text><text x="230" y="407" text-anchor="middle" font-size="27" font-weight="700" fill="#b05814">減価修正</text><text x="230" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#1771a8">→ 積算価格</text></g>
    <g transform="translate(570 220)"><rect width="460" height="465" rx="25" fill="#fff" stroke="#70a67d" stroke-width="5"/><text x="230" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#123f66">取引事例比較法</text><text x="230" y="122" text-anchor="middle" font-size="28" fill="#344b5e">似た物件はいくらで売れた？</text><g fill="#dcefe2"><rect x="70" y="160" width="90" height="105"/><rect x="185" y="145" width="90" height="120"/><rect x="300" y="175" width="90" height="90"/></g><path d="M230 285v50" stroke="#e18a21" stroke-width="9" marker-end="url(#arrow)"/><text x="230" y="375" text-anchor="middle" font-size="26" fill="#344b5e">時点・地域・個別条件を補正</text><text x="230" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#14834e">→ 比準価格</text></g>
    <g transform="translate(1070 220)"><rect width="460" height="465" rx="25" fill="#fff" stroke="#d49a42" stroke-width="5"/><text x="230" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#123f66">収益還元法</text><text x="230" y="122" text-anchor="middle" font-size="28" fill="#344b5e">将来、いくら稼ぐ？</text><text x="80" y="205" font-size="25" fill="#344b5e">1年目</text><text x="190" y="205" font-size="25" fill="#344b5e">2年目</text><text x="300" y="205" font-size="25" fill="#344b5e">3年目…</text><path d="M105 230h250" stroke="#d49a42" stroke-width="12"/><path d="M230 275v55" stroke="#e18a21" stroke-width="9" marker-end="url(#arrow)"/><text x="230" y="370" text-anchor="middle" font-size="27" fill="#344b5e">将来の純収益を</text><text x="230" y="407" text-anchor="middle" font-size="27" font-weight="700" fill="#b05814">現在価値へ</text><text x="230" y="445" text-anchor="middle" font-size="25" font-weight="700" fill="#c17414">→ 収益価格</text></g>
    <rect x="235" y="750" width="1130" height="90" rx="22" fill="#123f66"/><text x="800" y="807" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">建築費・類似取引・将来収益 ─ 出発点を入れ替えない</text>
  </g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#e18a21"/></marker></defs>
</svg>
