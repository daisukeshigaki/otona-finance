<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">払済保険・延長保険と個人年金の違い</title><desc id="desc">保険料の払込みを止める二つの変更方法と、確定年金・終身年金の支払条件を説明する図</desc>
  <defs><style>text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;fill:#173b5f}.title{font-size:53px;font-weight:800}.sub{font-size:24px;fill:#5c7080}.head{font-size:31px;font-weight:800}.body{font-size:23px}.small{font-size:20px;fill:#536a7c}.key{font-size:26px;font-weight:800}.white{fill:#fff}.axis{stroke:#426b8a;stroke-width:6}.dash{stroke:#8da5b6;stroke-width:3;stroke-dasharray:10 8}</style></defs>
  <rect width="1600" height="900" fill="#f7fafc"/><text x="800" y="68" text-anchor="middle" class="title">「保障額」と「期間」を別々に見る</text><text x="800" y="108" text-anchor="middle" class="sub">契約変更と個人年金は、何を維持し、いつまで支払うかが違う</text>
  <g transform="translate(65 150)"><rect width="720" height="315" rx="25" fill="#eaf4fb" stroke="#79a7c4" stroke-width="3"/><text x="360" y="53" text-anchor="middle" class="head">保険料の払込みを止める方法</text><line x1="360" y1="78" x2="360" y2="285" class="dash"/>
    <text x="180" y="105" text-anchor="middle" class="key">払済保険</text><rect x="55" y="130" width="250" height="58" rx="10" fill="#17689b"/><text x="180" y="167" text-anchor="middle" class="body white">保障額：小さくなる</text><line x1="80" y1="225" x2="280" y2="225" class="axis"/><circle cx="80" cy="225" r="10" fill="#17689b"/><circle cx="280" cy="225" r="10" fill="#17689b"/><text x="80" y="260" text-anchor="middle" class="small">変更</text><text x="280" y="260" text-anchor="middle" class="small">元の満了</text><text x="180" y="293" text-anchor="middle" class="body">期間：原則そのまま</text>
    <text x="540" y="105" text-anchor="middle" class="key">延長（定期）保険</text><rect x="415" y="130" width="250" height="58" rx="10" fill="#197451"/><text x="540" y="167" text-anchor="middle" class="body white">保障額：元と同じ</text><line x1="430" y1="225" x2="590" y2="225" class="axis"/><line x1="590" y1="225" x2="650" y2="225" class="dash"/><circle cx="430" cy="225" r="10" fill="#197451"/><circle cx="590" cy="225" r="10" fill="#197451"/><text x="430" y="260" text-anchor="middle" class="small">変更</text><text x="590" y="260" text-anchor="middle" class="small">早く満了</text><text x="540" y="293" text-anchor="middle" class="body">期間：短くなることがある</text>
  </g>
  <g transform="translate(815 150)"><rect width="720" height="315" rx="25" fill="#fff5df" stroke="#caa35b" stroke-width="3"/><text x="360" y="53" text-anchor="middle" class="head">共通する注意</text><text x="55" y="110" class="body">① 解約返戻金を一時払保険料へ充てる</text><text x="55" y="157" class="body">② 以後の保険料払込みを中止する</text><text x="55" y="204" class="body">③ 特約は原則として消滅する</text><rect x="55" y="235" width="610" height="52" rx="13" fill="#fff"/><text x="360" y="269" text-anchor="middle" class="key">どちらを選べるか・変更後の条件は契約で確認</text></g>
  <g transform="translate(65 505)"><rect width="1470" height="320" rx="25" fill="#eef7f3" stroke="#75a990" stroke-width="3"/><text x="735" y="53" text-anchor="middle" class="head">個人年金は「生存条件」と「保証期間」を見る</text><line x1="735" y1="78" x2="735" y2="285" class="dash"/>
    <text x="360" y="105" text-anchor="middle" class="key">10年確定年金</text><line x1="90" y1="175" x2="630" y2="175" class="axis"/><g fill="#17689b"><circle cx="90" cy="175" r="11"/><circle cx="225" cy="175" r="11"/><circle cx="360" cy="175" r="11"/><circle cx="495" cy="175" r="11"/><circle cx="630" cy="175" r="11"/></g><text x="90" y="145" text-anchor="middle" class="small">開始</text><text x="630" y="145" text-anchor="middle" class="small">10年後</text><text x="360" y="225" text-anchor="middle" class="body">期間中に本人が死亡しても</text><text x="360" y="263" text-anchor="middle" class="key">残期間分を遺族へ支払う</text>
    <text x="1095" y="105" text-anchor="middle" class="key">保証期間付終身年金</text><line x1="835" y1="175" x2="1375" y2="175" class="axis"/><rect x="835" y="149" width="235" height="52" rx="12" fill="#f5cf78"/><text x="953" y="184" text-anchor="middle" class="body">保証期間</text><path d="M1375 175l-35-22v44z" fill="#426b8a"/><text x="1095" y="225" text-anchor="middle" class="body">保証期間内の死亡：残期間分を遺族へ</text><text x="1095" y="263" text-anchor="middle" class="key">生存中は保証期間後も一生涯</text>
  </g><text x="800" y="872" text-anchor="middle" class="sub">確定年金を「本人が生存している間だけ」と読むのは誤り</text>
</svg>
