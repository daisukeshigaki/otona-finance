<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">保険制度の全体地図</title><desc id="desc">社会保険、民間保険、共済、少額短期保険の運営主体と破綻時の保護を比較する図</desc>
  <defs><style>text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;fill:#173b5f}.title{font-size:55px;font-weight:800}.sub{font-size:25px;fill:#5b6d7d}.head{font-size:31px;font-weight:800}.body{font-size:23px}.small{font-size:20px;fill:#52697a}.white{fill:#fff}.key{font-size:25px;font-weight:800}.line{stroke:#94afc1;stroke-width:4}</style></defs>
  <rect width="1600" height="900" fill="#f7fafc"/><text x="800" y="72" text-anchor="middle" class="title">保険制度は「誰が運営するか」で分ける</text><text x="800" y="112" text-anchor="middle" class="sub">似た名前でも、加入の根拠と破綻時の保護は同じではない</text>
  <rect x="90" y="150" width="1420" height="105" rx="24" fill="#173b5f"/><text x="800" y="198" text-anchor="middle" class="head white">病気・けが・死亡・老後・事故などの経済的リスク</text><text x="800" y="232" text-anchor="middle" class="body white">まず公的保障を確認し、不足する部分を契約や共済で補う</text>
  <path d="M800 255v50M280 305h1040M280 305v45M630 305v45M980 305v45M1320 305v45" class="line" fill="none"/>
  <g transform="translate(65 350)"><rect width="430" height="430" rx="24" fill="#e5f2fb" stroke="#4d94bd" stroke-width="3"/><rect width="430" height="78" rx="24" fill="#17689b"/><path d="M0 50h430v28H0z" fill="#17689b"/><text x="215" y="50" text-anchor="middle" class="head white">社会保険</text><text x="28" y="125" class="key">法律に基づく公的保障</text><text x="28" y="169" class="body">健康保険・年金・介護</text><text x="28" y="205" class="body">雇用保険・労災保険など</text><rect x="28" y="245" width="374" height="105" rx="15" fill="#fff"/><text x="215" y="283" text-anchor="middle" class="body">国・地方公共団体や</text><text x="215" y="320" text-anchor="middle" class="body">公的な保険者が運営</text><text x="215" y="392" text-anchor="middle" class="small">民間契約とは別制度</text></g>
  <g transform="translate(520 350)"><rect width="430" height="430" rx="24" fill="#e8f6ef" stroke="#4d9a72" stroke-width="3"/><rect width="430" height="78" rx="24" fill="#197451"/><path d="M0 50h430v28H0z" fill="#197451"/><text x="215" y="50" text-anchor="middle" class="head white">民間保険</text><text x="28" y="125" class="key">契約で保障を上乗せ</text><text x="28" y="169" class="body">生命保険・損害保険</text><text x="28" y="205" class="body">第三分野の保険</text><rect x="28" y="245" width="374" height="105" rx="15" fill="#fff"/><text x="215" y="283" text-anchor="middle" class="body">金融庁の免許を受けた</text><text x="215" y="320" text-anchor="middle" class="body">保険会社が引受け</text><text x="215" y="382" text-anchor="middle" class="small">生命・損害それぞれの</text><text x="215" y="410" text-anchor="middle" class="small">契約者保護機構あり</text></g>
  <g transform="translate(975 350)"><rect width="260" height="430" rx="24" fill="#fff5df" stroke="#c18b29" stroke-width="3"/><rect width="260" height="78" rx="24" fill="#a76e0c"/><path d="M0 50h260v28H0z" fill="#a76e0c"/><text x="130" y="50" text-anchor="middle" class="head white">共済</text><text x="22" y="125" class="key">組合員等が対象</text><text x="22" y="170" class="body">農協・生協等の</text><text x="22" y="205" class="body">根拠法を持つ団体</text><rect x="22" y="245" width="216" height="105" rx="15" fill="#fff"/><text x="130" y="283" text-anchor="middle" class="body">根拠法と</text><text x="130" y="320" text-anchor="middle" class="body">運営団体を確認</text><text x="130" y="394" text-anchor="middle" class="small">保険会社の商品と</text><text x="130" y="421" text-anchor="middle" class="small">同じとは限らない</text></g>
  <g transform="translate(1260 350)"><rect width="275" height="430" rx="24" fill="#f7ecf4" stroke="#a46a91" stroke-width="3"/><rect width="275" height="78" rx="24" fill="#844b73"/><path d="M0 50h275v28H0z" fill="#844b73"/><text x="138" y="50" text-anchor="middle" class="head white">少額短期</text><text x="20" y="125" class="key">少額・短期の契約</text><text x="20" y="167" class="body">生命・医療：原則1年</text><text x="20" y="203" class="body">損害：原則2年</text><rect x="20" y="245" width="235" height="105" rx="15" fill="#fff"/><text x="138" y="283" text-anchor="middle" class="body">財務局へ登録した</text><text x="138" y="320" text-anchor="middle" class="body">少額短期保険業者</text><text x="138" y="382" text-anchor="middle" class="small">契約者保護機構の</text><text x="138" y="410" text-anchor="middle" class="small">対象外</text></g>
  <rect x="210" y="820" width="1180" height="52" rx="16" fill="#fff0c8"/><text x="800" y="854" text-anchor="middle" class="key">試験の読み方：商品名だけでなく「運営主体・契約条件・破綻時の保護」を確認</text>
</svg>
