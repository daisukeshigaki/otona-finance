<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">保険と税の四つの判定</title><desc id="desc">入院給付金、死亡保険金、地震保険料、事業用固定資産の保険金について税務上の扱いを説明する図</desc>
  <defs><style>text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif;fill:#173b5f}.title{font-size:54px;font-weight:800}.sub{font-size:24px;fill:#5b6e7e}.head{font-size:30px;font-weight:800}.body{font-size:23px}.small{font-size:20px;fill:#536a7a}.key{font-size:26px;font-weight:800}.white{fill:#fff}.arrow{stroke:#527c99;stroke-width:6;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527c99"/></marker></defs>
  <rect width="1600" height="900" fill="#f7fafc"/><text x="800" y="72" text-anchor="middle" class="title">「非課税」の一言で終わらせない</text><text x="800" y="112" text-anchor="middle" class="sub">誰が受け取り、何の損失を補い、どの計算で控除するかを分ける</text>
  <g transform="translate(55 155)"><rect width="720" height="285" rx="24" fill="#e8f3fa" stroke="#78a9c6" stroke-width="3"/><rect width="720" height="68" rx="24" fill="#17689b"/><path d="M0 43h720v25H0z" fill="#17689b"/><text x="360" y="45" text-anchor="middle" class="head white">① 入院・手術給付金</text><text x="35" y="112" class="body">病気・けがに基づく所定の給付</text><path d="M315 103h105" class="arrow"/><rect x="435" y="82" width="245" height="58" rx="13" fill="#fff"/><text x="558" y="119" text-anchor="middle" class="key">所得税：原則非課税</text><text x="35" y="178" class="body">ただし医療費控除では</text><text x="35" y="218" class="body">対象医療費から補てん額を差し引く</text><text x="35" y="257" class="small">給付金が無かった医療費からまで差し引かない</text></g>
  <g transform="translate(825 155)"><rect width="720" height="285" rx="24" fill="#eef7ef" stroke="#78aa83" stroke-width="3"/><rect width="720" height="68" rx="24" fill="#197451"/><path d="M0 43h720v25H0z" fill="#197451"/><text x="360" y="45" text-anchor="middle" class="head white">② 死亡保険金</text><text x="35" y="112" class="body">亡くなった人が保険料を負担</text><text x="35" y="150" class="body">相続人が死亡保険金を受け取る</text><path d="M345 126h75" class="arrow"/><rect x="435" y="82" width="245" height="85" rx="13" fill="#fff"/><text x="558" y="117" text-anchor="middle" class="body">相続税</text><text x="558" y="150" text-anchor="middle" class="key">非課税枠あり</text><text x="35" y="211" class="key">500万円 × 法定相続人の数</text><text x="35" y="253" class="small">枠を超えた金額＝税額、ではなく課税価格の計算へ入る金額</text></g>
  <g transform="translate(55 475)"><rect width="720" height="285" rx="24" fill="#fff5df" stroke="#c6a15b" stroke-width="3"/><rect width="720" height="68" rx="24" fill="#a76e0c"/><path d="M0 43h720v25H0z" fill="#a76e0c"/><text x="360" y="45" text-anchor="middle" class="head white">③ 地震保険料を支払う</text><text x="35" y="115" class="body">所定の地震保険料</text><path d="M250 107h150" class="arrow"/><rect x="415" y="82" width="270" height="65" rx="13" fill="#fff"/><text x="550" y="123" text-anchor="middle" class="key">所得控除</text><text x="35" y="190" class="body">所得税：年間支払額の全額</text><text x="35" y="230" class="key">上限 5万円</text><text x="35" y="263" class="small">税金が5万円そのまま減る「税額控除」ではない</text></g>
  <g transform="translate(825 475)"><rect width="720" height="285" rx="24" fill="#f7ecf4" stroke="#aa7898" stroke-width="3"/><rect width="720" height="68" rx="24" fill="#844b73"/><path d="M0 43h720v25H0z" fill="#844b73"/><text x="360" y="45" text-anchor="middle" class="head white">④ 事業用固定資産の保険金</text><text x="35" y="112" class="body">店舗・機械等の損害を補う保険金</text><path d="M350 103h70" class="arrow"/><rect x="435" y="82" width="245" height="58" rx="13" fill="#fff"/><text x="558" y="119" text-anchor="middle" class="key">所得税：原則非課税</text><text x="35" y="180" class="body">ただし事業の損失を計算するとき</text><text x="35" y="220" class="key">損失額 − 受取保険金</text><text x="35" y="258" class="small">休業利益や経費補てんの保険金は収入となる場合がある</text></g>
  <rect x="240" y="805" width="1120" height="58" rx="17" fill="#fff0c8"/><text x="800" y="843" text-anchor="middle" class="key">順番：①原因　②保険料負担者　③受取人　④補う損失　⑤控除・税目</text>
</svg>
